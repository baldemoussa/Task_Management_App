<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js" defer></script>
    <title>SBA 4: Task Management App</title>
</head>

<body>
    <main>
        <div class="container my-4">
            <h1 class="text-center">Task Management App</h1>
            <div class="p-3 m-0 border-0 bd-example bd-example-row">
                <div class="card mb-4">
                    <div class="card-header">
                        <h3 class="text-center">Add a New Task</h3>
                    </div>
                    <div class="card-body">
                        <form id="taskForm" class="row g-3 px-2">
                            <div class="col-md-5">
                                <label for="task-name" class="form-label">Task Name</label>
                                <input type="text" id="task-name" placeholder="Enter a task Name" class="form-control"
                                    required>
                            </div>
                            <div class="col-md-3">
                                <label for="task-category" class="form-label">Category</label>
                                <input type="text" id="task-category" placeholder="Enter a category"
                                    class="form-control" required>
                            </div>
                            <div class="col-md-2">
                                <label for="task-deadline" class="form-label">Deadline</label>
                                <input type="date" id="task-deadline" placeholder="Enter a Deadline"
                                    class="form-control" required>
                            </div>
                            <div class="col-md-2">
                                <label for="task-status" class="form-label">Status</label>
                                <select id="task-status" class="form-select" aria-label="Default select example"
                                    required>
                                    <option value="Open" selected>Open</option>
                                    <option value="In Progress">In Progress</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Overdue">Overdue</option>
                                </select>
                            </div>
                            <div class="col-12 mt-3 text-center">
                                <button id="add-task-button" type="submit" class="btn btn-primary">Add
                                </button>
                                <button id="clear-task-button" type="reset" class="btn btn-danger">Clear</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card" id="task-list-container">
                    <div class="card-header">
                        <h3 class="text-center">List of Tasks</h3>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-end mb-2">
                            <button id="purge-button" class="btn btn-outline-danger">Purge Tasks</button>
                        </div>
                        <p id="confirmation-message"
                            class="container text-success alert alert-info mt-1 text-center mx-auto w-75">
                        </p>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col" class="col-md-2 text-end">Filter by Category / Status
                                    </th>
                                    <th scope="col" class="col-md-3"> <input type="text" id="filter-category"
                                            placeholder="Enter a Category" class="form-control"></th>
                                    <th scope="col" class="col-md-2">
                                        <select id="filter-task-status" class="form-select"
                                            aria-label="Default select example" required>
                                            <option value="" selected>--- By Status ---</option>
                                            <option value="Open">Open</option>
                                            <option value="In Progress">In Progress</option>
                                            <option value="Completed">Completed</option>
                                            <option value="Overdue">Overdue</option>
                                        </select>
                                    </th>
                                </tr>
                            </thead>
                            <thead>
                                <tr>
                                    <th scope="col" class="col-md-5">Task Name</th>
                                    <th scope="col" class="col-md-3">Category</th>
                                    <th scope="col" class="col-md-2">Deadline</th>
                                    <th scope="col" class="col-md-2">Status</th>
                                    <th scope="col" class="col-md-1">Delete</th>
                                </tr>
                            </thead>
                            <tbody id="task-list">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
    </footer>
</body>

</html>
